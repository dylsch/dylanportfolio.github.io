<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1226">
<title>Boozy Bingo · Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1d1226; --panel: #2a1b36; --panel-2: #352245; --line: #4a3360; --text: #f6eefb; --muted: #bba7c9;
  --accent: #ffb238; --accent-ink: #2a1600; --pink: #ff5d8f; --green: #1ed760; --danger: #ff6b6b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, sans-serif; min-height: 100vh; }
h1, h2, h3 { font-family: Fredoka, Inter, sans-serif; font-weight: 600; margin: 0 0 .4em; }
.wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.brand { font: 700 22px Fredoka, sans-serif; }
.brand span { color: var(--accent); }
.me { color: var(--muted); font-size: 13px; text-align: right; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.center { text-align: center; }
.big { font-size: 46px; }
.hint { color: var(--muted); font-size: 14px; }
input[type=text] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font: inherit; font-size: 17px; }
input:focus { outline: 2px solid var(--accent); }
.btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; font: 600 16px Inter, sans-serif; cursor: pointer; width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .5; }
.mt { margin-top: 12px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
.tabs button { background: none; border: 0; color: var(--muted); font: 600 15px Fredoka, sans-serif; padding: 9px; border-radius: 10px; cursor: pointer; }
.tabs button.active { background: var(--accent); color: var(--accent-ink); }
.tabs button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); margin-left: 5px; vertical-align: middle; }

.bgrid { display: grid; gap: 3px; background: #6a1b9a; border: 3px solid #6a1b9a; border-radius: 10px; overflow: hidden; }
.bcell { background: #fff; color: #1a1020; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 3px; font-size: 10.5px; line-height: 1.15; cursor: pointer; user-select: none; position: relative; overflow: hidden; }
.g3 .bcell { font-size: 14px; } .g4 .bcell { font-size: 12px; }
.bcell .t { font-weight: 700; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bcell .a { color: #6b5b77; font-size: .85em; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.bcell.free { background: #ffe3a8; color: #6a1b9a; font: 700 13px Fredoka, sans-serif; cursor: default; }
.bcell.on { background: #ffd1e0; }
.bcell.on::after { content: ""; position: absolute; inset: 10%; border: 3px solid #e91e63; border-radius: 50%; opacity: .85; }
.bingo { margin-top: 14px; font: 700 26px Fredoka, sans-serif; letter-spacing: 1px; padding: 14px; background: var(--pink); border-color: var(--pink); color: #fff; }
.verdict { margin-top: 12px; padding: 12px; border-radius: 12px; text-align: center; font-weight: 600; }
.verdict.ok { background: rgba(30,215,96,.15); color: var(--green); }
.verdict.no { background: rgba(255,107,107,.15); color: var(--danger); }

.qnum { color: var(--accent); font-weight: 600; font-size: 13px; }
.mlwho { color: var(--accent); font: 600 16px Fredoka, sans-serif; margin: 8px 0 0; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qtime { font: 700 18px Fredoka, sans-serif; color: var(--accent); }
.team { display: inline-block; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 8px; font-weight: 600; font-size: 12px; }
.qq { font-size: 21px; line-height: 1.25; margin: 6px 0 14px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--bg); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 13px 14px; font: 600 16px Inter, sans-serif; cursor: pointer; }
.opt b { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: Fredoka, sans-serif; }
.opt.sel { border-color: var(--accent); background: rgba(255,178,56,.14); }
.opt.right { border-color: var(--green); background: rgba(30,215,96,.15); }
.opt.right b { background: var(--green); }
.opt.wrong { border-color: var(--danger); background: rgba(255,107,107,.12); }
.opt.dim { opacity: .4; }
.opt:disabled { cursor: default; }
.sip { font: 600 19px Fredoka, sans-serif; text-align: center; margin-top: 14px; }
.board { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: r; }
.board li { counter-increment: r; display: flex; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; margin-bottom: 7px; font-size: 16px; }
.board li::before { content: counter(r) "."; color: var(--muted); }
.board li span { flex: 1; }
.board li.mine { border-color: var(--accent); background: rgba(255,178,56,.12); }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">🍹 Boozy <span>Bingo</span></div><div class="me" id="me"></div></header>
  <div id="view"><div class="card center"><p class="hint">Loading…</p></div></div>
  <p class="foot">🍻 Please drink responsibly. Water counts too.</p>
</div>
<script src="firebase-config.js"></script>
<script type="module" src="play.js"></script>
</body>
</html>
