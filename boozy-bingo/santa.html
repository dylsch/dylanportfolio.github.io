<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1f17">
<title>Secret Santa · Party Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1f17; --panel: #12291f; --panel-2: #193628; --line: #2a5040; --text: #f3fbf6; --muted: #a9c9b8;
  --accent: #f2c14e; --accent-ink: #241a00; --pink: #ff5a67; --green: #1ed760;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 Inter, system-ui, sans-serif; min-height: 100vh; }
h1, h2, h3 { font-family: Fredoka, Inter, sans-serif; font-weight: 600; margin: 0 0 .4em; }
.wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 18px 16px 40px; }
header { font: 700 20px Fredoka, sans-serif; margin-bottom: 14px; }
header span { color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.card + .card { margin-top: 14px; }
.center { text-align: center; }
.hint { color: var(--muted); font-size: 14px; }
.btn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font: 600 16px Inter, sans-serif; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .6; }
.gift { font-size: 96px; line-height: 1; background: none; border: 0; cursor: pointer; display: block; margin: 10px auto; animation: wobble 2.4s ease-in-out infinite; }
.gift.open { animation: unwrap .6s ease-in forwards; }
@keyframes wobble { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-8deg); } 90% { transform: rotate(8deg); } 95% { transform: rotate(-4deg); } }
@keyframes unwrap { 0% { transform: scale(1); } 50% { transform: scale(1.25) rotate(10deg); } 100% { transform: scale(0); opacity: 0; } }
.name { font: 700 clamp(38px, 11vw, 56px) Fredoka, sans-serif; color: var(--accent); margin: 4px 0 8px; animation: pop .45s ease-out; word-break: break-word; }
@keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
.facts { display: grid; gap: 6px; margin: 12px 0 4px; }
.facts div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.wish { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
input[type=text], input[type=url] { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font: inherit; }
input:focus, .btn:focus-visible, .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mt { margin-top: 12px; }
.wants { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.wants li { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.wants li span { flex: 1; word-break: break-word; }
.wants a { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; }
.wants button { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 6px; }
.addwant { display: grid; gap: 8px; margin-top: 10px; }
.month { margin-top: 12px; }
.month h4 { font: 600 15px Fredoka, sans-serif; margin: 0 0 6px; }
.grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.grid7 .dow { text-align: center; color: var(--muted); font-size: 12px; }
.day { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 600 15px Inter, sans-serif; cursor: pointer; display: grid; place-items: center; padding: 0; }
.day.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day.on::after { content: "✓"; font-size: 10px; display: block; line-height: 0; margin-top: -6px; }
.day.chosen { box-shadow: 0 0 0 2px var(--green); }
.day:disabled { opacity: .25; cursor: default; }
.banner { background: color-mix(in srgb, var(--green) 15%, transparent); border: 1px solid var(--green); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
</style>
</head>
<body>
<script src="themes.js"></script>
<script>BoozyThemes.apply('christmas');</script>
<div class="wrap">
  <header>🎁 Secret <span>Santa</span></header>
  <div id="view"><div class="card center"><p class="hint">Loading…</p></div></div>
</div>
<script src="firebase-config.js"></script>
<script type="module">
// Each participant's private page. The link's token is the only key to their match, so pages can't be listed.
const FIREBASE = 'https://www.gstatic.com/firebasejs/10.14.1/';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const view = $('#view');
const q = new URLSearchParams(location.search), drawId = q.get('d'), tok = q.get('t');
const screen = (icon, title, text) => { view.innerHTML = `<div class="card center"><div style="font-size:48px">${icon}</div><h2>${title}</h2><p class="hint">${text}</p></div>`; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const nice = (day, opts = { weekday: 'long', day: 'numeric', month: 'long' }) => new Date(day + 'T12:00').toLocaleDateString(undefined, opts);
// Only real web links become clickable.
const safeLink = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };

if (!drawId || !tok) screen('🔗', 'Link incomplete', 'Open the full link from your invite.');
else main().catch(e => screen('📡', "Couldn't load your match", esc(e.message || e) + '. Check your connection and refresh.'));

async function main() {
  const [{ initializeApp }, fs] = await Promise.all(['firebase-app.js', 'firebase-firestore.js'].map(f => import(FIREBASE + f)));
  const db = fs.getFirestore(initializeApp(window.BOOZY_FIREBASE, 'santa'));
  const ref = fs.doc(db, 'santa', drawId, 'reveals', tok);
  const snap = await fs.getDoc(ref);
  if (!snap.exists()) return screen('🎄', 'This link has expired', 'The organiser may have redrawn the names. Ask them for your new link.');
  const r = snap.data();
  document.title = `${r.event} · Secret Santa`;

  view.innerHTML = `<div class="card center">
    <h1>Hi ${esc(r.name)}! 🎅</h1>
    <p class="hint">Welcome to <b>${esc(r.event)}</b>. Make sure nobody's looking over your shoulder…</p>
    <button class="gift" id="gift" aria-label="Unwrap your Secret Santa match">🎁</button>
    <p class="hint">Tap the present to see who you're buying for</p></div>`;
  $('#gift').onclick = () => {
    $('#gift').classList.add('open');
    setTimeout(reveal, 550);
    if (!r.openedAt) fs.updateDoc(ref, { openedAt: fs.serverTimestamp() }).catch(() => {});
  };

  async function reveal() {
    view.innerHTML = `<div class="card center">
        <p class="hint">${esc(r.name)}, you're buying a gift for…</p>
        <div class="name">${esc(r.to)}</div>
        <div class="facts">${r.budget ? `<div>💶 Budget: <b>${esc(r.budget)}</b></div>` : ''}${r.date ? `<div>📅 Gift exchange: <b>${esc(nice(r.date))}</b></div>` : ''}${r.note ? `<div>📝 ${esc(r.note)}</div>` : ''}</div>
        <p class="hint">🤫 Keep it secret!</p>
        <button class="btn" id="hide">Hide name</button>
      </div>
      <div class="card"><h3>🎄 What ${esc(r.to)} would like</h3><div id="theirWants" class="hint">Loading…</div></div>
      <div class="card"><h3>✍️ What would you like?</h3>
        <p class="hint">Add a few ideas for your own Secret Santa, with a link if you like. They'll see this list on their page.</p>
        <ul class="wants" id="myWants"></ul>
        <div class="addwant">
          <input type="text" id="wantItem" maxlength="80" placeholder="e.g. A cookbook, a plant for my balcony…" aria-label="Something you'd like">
          <input type="url" id="wantLink" maxlength="300" placeholder="Link (optional), e.g. https://…" aria-label="Link (optional)">
          <button class="btn primary" id="addWant">Add to my list</button>
        </div>
        <p class="hint" id="wantStatus"></p>
      </div>
      ${r.calFrom && r.calTo && r.myAvail ? `<div class="card" id="calCard"><h3>📅 When are you free?</h3>
        <p class="hint">Tap every day you could make the gift exchange. Your answers save automatically.</p>
        ${r.date ? `<div class="banner">📌 The organiser has picked <b>${esc(nice(r.date))}</b>. You can still update your days.</div>` : ''}
        <div id="cal"></div><p class="hint" id="calStatus"></p></div>` : ''}`;
    $('#hide').onclick = () => {
      const n = view.querySelector('.name'), hidden = n.style.visibility === 'hidden';
      n.style.visibility = hidden ? 'visible' : 'hidden'; $('#hide').textContent = hidden ? 'Hide name' : 'Show name';
    };

    // Their wants (with the old free-text wishlist as a fallback).
    const theirs = await fs.getDoc(fs.doc(db, 'santa', drawId, 'wishes', r.theirWish)).catch(() => null);
    const td = theirs && theirs.exists() ? theirs.data() : {};
    const theirWants = (td.wants || []).filter(w => w && w.item), oldText = (td.wishlist || '').trim();
    $('#theirWants').outerHTML = theirWants.length ? `<ul class="wants">${theirWants.map(w => { const l = safeLink(w.link);
        return `<li><span>🎁 ${esc(w.item)}</span>${l ? `<a href="${esc(l)}" target="_blank" rel="noopener noreferrer">View ↗</a>` : ''}</li>`; }).join('')}</ul>`
      : oldText ? `<div class="wish">${esc(oldText)}</div>`
      : `<p class="hint">${esc(r.to)} hasn't added anything yet. Check back later!</p>`;

    // My wants: every add or remove saves straight away.
    const mineRef = fs.doc(db, 'santa', drawId, 'wishes', r.myWish);
    const mine = await fs.getDoc(mineRef).catch(() => null);
    const md = mine && mine.exists() ? mine.data() : {};
    let wants = (md.wants || []).filter(w => w && w.item);
    if (!wants.length && (md.wishlist || '').trim()) wants = md.wishlist.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 20).map(item => ({ item: item.slice(0, 80), link: '' }));
    const drawWants = () => {
      $('#myWants').innerHTML = wants.length ? wants.map((w, i) => { const l = safeLink(w.link);
        return `<li><span>🎁 ${esc(w.item)}</span>${l ? `<a href="${esc(l)}" target="_blank" rel="noopener noreferrer">Link ↗</a>` : ''}<button data-del="${i}" aria-label="Remove ${esc(w.item)}">✕</button></li>`; }).join('')
        : '<li class="hint"><span>Nothing yet. Add your first idea below.</span></li>';
      $('#myWants').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { wants.splice(Number(b.dataset.del), 1); saveWants(); });
      $('#addWant').disabled = wants.length >= 20;
    };
    async function saveWants() {
      drawWants();
      $('#wantStatus').textContent = 'Saving…';
      try { await fs.updateDoc(mineRef, { wants, updatedAt: fs.serverTimestamp() }); $('#wantStatus').textContent = '✅ Saved. Your Santa can see your list.'; }
      catch (e) { $('#wantStatus').textContent = '⚠️ ' + e.message; }
    }
    const add = () => {
      const item = $('#wantItem').value.trim().slice(0, 80), raw = $('#wantLink').value.trim().slice(0, 300);
      if (!item) { $('#wantItem').focus(); return; }
      if (raw && !safeLink(raw)) { $('#wantStatus').textContent = '⚠️ That link doesn\'t look right. It should start with https://'; return; }
      wants.push({ item, link: raw ? safeLink(raw) : '' });
      $('#wantItem').value = ''; $('#wantLink').value = ''; $('#wantItem').focus();
      saveWants();
    };
    $('#addWant').onclick = add;
    $('#wantItem').onkeydown = e => { if (e.key === 'Enter') add(); };
    $('#wantLink').onkeydown = e => { if (e.key === 'Enter') add(); };
    drawWants();

    // Availability calendar: Monday-first months covering the organiser's date range.
    if (!$('#calCard')) return;
    const availRef = fs.doc(db, 'santa', drawId, 'avail', r.myAvail);
    const av = await fs.getDoc(availRef).catch(() => null);
    const free = new Set(av && av.exists() ? av.data().days || [] : []);
    let saveTimer = null;
    const drawCal = () => {
      const from = new Date(r.calFrom + 'T12:00'), to = new Date(r.calTo + 'T12:00');
      let html = '';
      for (let m = new Date(from.getFullYear(), from.getMonth(), 1, 12); m <= to; m = new Date(m.getFullYear(), m.getMonth() + 1, 1, 12)) {
        const lead = (m.getDay() + 6) % 7, daysIn = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
        html += `<div class="month"><h4>${esc(m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</h4><div class="grid7">
          ${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<span class="dow" aria-hidden="true">${d}</span>`).join('')}
          ${'<span></span>'.repeat(lead)}
          ${Array.from({ length: daysIn }, (_, i) => {
            const day = iso(new Date(m.getFullYear(), m.getMonth(), i + 1, 12)), inRange = day >= r.calFrom && day <= r.calTo;
            return `<button class="day${free.has(day) ? ' on' : ''}${day === r.date ? ' chosen' : ''}" data-day="${day}" ${inRange ? '' : 'disabled'}
              aria-pressed="${free.has(day)}" aria-label="${esc(nice(day))}${free.has(day) ? ', free' : ''}">${i + 1}</button>`;
          }).join('')}</div></div>`;
      }
      $('#cal').innerHTML = html;
      $('#calStatus').textContent = free.size ? `You're free on ${free.size} day${free.size === 1 ? '' : 's'}.` : 'No days ticked yet.';
      $('#cal').querySelectorAll('.day:not(:disabled)').forEach(b => b.onclick = () => {
        free.has(b.dataset.day) ? free.delete(b.dataset.day) : free.add(b.dataset.day);
        drawCal();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try { await fs.updateDoc(availRef, { days: [...free].sort(), updatedAt: fs.serverTimestamp() }); $('#calStatus').textContent += ' ✅ Saved.'; }
          catch (e) { $('#calStatus').textContent = '⚠️ ' + e.message; }
        }, 500);
      });
    };
    drawCal();
  }
}
</script>
</body>
</html>
